name: Publicar en YouTube
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths: ["cola/**", "auth/code.txt", "auth/client.enc", "auth/ajustes.json", "scripts/yt.py"]
permissions:
  contents: write
concurrency:
  group: youtube
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Publicar vídeos pendientes
        env:
          YT_KEY: ${{ secrets.YT_KEY }}
        run: python3 scripts/yt.py
      - name: Guardar cambios
        run: |
          git config user.name "locosclips-bot"
          git config user.email "locosclips-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publicación automática [skip ci]"
            for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
          fi
